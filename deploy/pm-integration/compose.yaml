# Edge only. Linux host networking lets Caddy reach 127.0.0.1:6768 and
# 127.0.0.1:3224 on the host. On Docker Desktop, run Caddy natively instead.
services:
  edge:
    image: caddy:2-alpine
    container_name: dovspace-pm-edge
    restart: unless-stopped
    network_mode: host
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    environment:
      EDGE_PORT: ${EDGE_PORT:-7000}
      PASEO_HOST: ${PASEO_HOST:-paseo.localhost}
      PM_HOST: ${PM_HOST:-pm.localhost}
      PASEO_UPSTREAM: ${PASEO_UPSTREAM:-127.0.0.1:6768}
      PM_UPSTREAM: ${PM_UPSTREAM:-127.0.0.1:3224}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
